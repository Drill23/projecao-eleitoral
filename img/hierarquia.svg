<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="300" fill="#fcfcfb"/>
  <text x="20" y="38" font-size="18" font-weight="700" fill="#0b0b0b">Camadas do modelo: do geral para o local</text>
  <text x="20" y="62" font-size="13" fill="#52514e">Cada camada corrige a de cima. Onde há poucos votos apurados, a correção local é "encolhida" na direção da média.</text>
  <g font-size="13.5" text-anchor="middle">
    <rect x="30" y="100" width="160" height="70" rx="10" fill="#2a78d6"/>
    <text x="110" y="132" fill="#fff" font-weight="700">País</text>
    <text x="110" y="152" fill="#eef4fc" font-size="12">(o estado, se governador)</text>
    <rect x="215" y="100" width="160" height="70" rx="10" fill="#5592de"/>
    <text x="295" y="132" fill="#fff" font-weight="700">Região</text>
    <text x="295" y="152" fill="#fff" font-size="12">(grupo de vizinhos)</text>
    <rect x="400" y="100" width="160" height="70" rx="10" fill="#80aee6"/>
    <text x="480" y="132" fill="#0b0b0b" font-weight="700">Estado</text>
    <text x="480" y="152" fill="#0b0b0b" font-size="12">(sub-grupo)</text>
    <rect x="585" y="100" width="160" height="70" rx="10" fill="#b3cff0"/>
    <text x="665" y="140" fill="#0b0b0b" font-weight="700">Município</text>
    <rect x="770" y="100" width="160" height="70" rx="10" fill="#e1ecfa"/>
    <text x="850" y="132" fill="#0b0b0b" font-weight="700">Seção</text>
    <text x="850" y="152" fill="#52514e" font-size="12">(o 1º turno dela)</text>
  </g>
  <g font-size="12" fill="#52514e">
    <text x="30" y="205">Presidente: Brasil → região (N, NE, CO, SE, S, exterior) → UF → município → seção.</text>
    <text x="30" y="227">Governador: estado → 4 grupos de municípios vizinhos → 12 sub-grupos → município → seção.</text>
    <text x="30" y="249">Os grupos de vizinhos são formados pela posição geográfica dos locais de votação.</text>
  </g>
</svg>
