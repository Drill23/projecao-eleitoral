<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="430" fill="#fcfcfb"/>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <text x="20" y="38" font-size="18" font-weight="700" fill="#0b0b0b">A ideia central: cada urna já votou uma vez</text>
  <text x="20" y="62" font-size="13" fill="#52514e">O 2º turno usa as mesmas seções do 1º. O modelo aprende, nas urnas já apuradas, como o voto mudou e aplica nas que faltam.</text>

  <!-- coluna 1: urna no 1º turno -->
  <text x="40" y="104" font-size="14" font-weight="700" fill="#0b0b0b">1º turno da urna</text>
  <g font-size="12" fill="#52514e">
    <rect x="40" y="118" width="190" height="22" rx="4" fill="#2a78d6"/><text x="236" y="134">A · 190 votos</text>
    <rect x="40" y="146" width="205" height="22" rx="4" fill="#eb6834"/><text x="251" y="162">B · 205</text>
    <rect x="40" y="174" width="34" height="22" rx="4" fill="#8a8985"/><text x="80" y="190">eliminados · 34</text>
    <rect x="40" y="202" width="22" height="22" rx="4" fill="#c9c8c2"/><text x="68" y="218">não escolheu ninguém · 22</text>
  </g>

  <!-- coluna 2: o que o modelo aprende -->
  <rect x="370" y="92" width="250" height="220" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="495" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">O que o modelo aprende</text>
  <g font-size="12.5" fill="#0b0b0b">
    <text x="388" y="150">• quanto dos eliminados vai para A</text>
    <text x="388" y="174">• como votam os "novos" (quem se</text>
    <text x="400" y="190">absteve ou anulou no 1º turno)</text>
    <text x="388" y="214">• o desvio do país, de cada região,</text>
    <text x="400" y="230">estado e município</text>
    <text x="388" y="254">• o comparecimento de cada lugar</text>
  </g>
  <text x="495" y="292" text-anchor="middle" font-size="11.5" fill="#52514e">comparando urnas apuradas: 1º turno × 2º turno</text>

  <!-- coluna 3: previsão -->
  <text x="720" y="104" font-size="14" font-weight="700" fill="#0b0b0b">2º turno previsto</text>
  <g font-size="12" fill="#52514e">
    <rect x="720" y="118" width="221" height="22" rx="4" fill="#2a78d6"/><text x="720" y="158">A · 221 votos (50,9%)</text>
    <rect x="720" y="168" width="213" height="22" rx="4" fill="#eb6834"/><text x="720" y="208">B · 213 (49,1%)</text>
  </g>

  <g stroke="#52514e" stroke-width="2" fill="none">
    <path d="M330 170 H366" marker-end="url(#s)"/>
    <path d="M620 170 H714" marker-end="url(#s)"/>
  </g>

  <!-- rodapé: soma -->
  <rect x="40" y="340" width="880" height="66" rx="10" fill="#fff" stroke="#c9c8c2" stroke-width="1.2"/>
  <text x="60" y="368" font-size="13.5" fill="#0b0b0b" font-weight="700">Projeção do resultado final</text>
  <text x="60" y="390" font-size="12.5" fill="#52514e">= votos já apurados + previsão de cada urna que falta. A faixa de 90% vem de repetir a conta centenas de vezes com valores plausíveis.</text>
</svg>
